name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: auth_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d auth_starter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/auth_starter?schema=public
      JWT_ACCESS_SECRET: ci-secret-that-is-long-enough-for-validation
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
